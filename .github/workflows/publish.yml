name: Publish to npm

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      version:
        description: 'New version to cut and publish (e.g. 4.0.2 or 5.0.0-beta.2). Leave empty to re-publish an existing tag instead.'
        required: false
      base_ref:
        description: 'Branch to cut the new version from (only used when "version" is set)'
        required: false
        default: 'main'
      tag:
        description: 'Existing tag to (re-)publish (only used when "version" is empty)'
        required: false
      prerelease:
        description: 'Mark as a pre-release / npm beta dist-tag'
        type: boolean
        default: false
      notes:
        description: 'Release notes (markdown, only used when "version" is set)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Determine tag
        id: vars
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "tag=v${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.release.tag_name || inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version && inputs.base_ref || steps.vars.outputs.tag }}
          fetch-depth: 0

      # Written via an env var, never interpolated into the script body, so
      # backticks / $() / heredoc markers in the notes stay literal text.
      - name: Write release notes
        if: inputs.notes != ''
        env:
          NOTES: ${{ inputs.notes }}
        run: printf '%s' "$NOTES" > "$RUNNER_TEMP/release-notes.md"

      - name: Create GitHub Release
        if: inputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --target "${{ inputs.base_ref }}" \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            $( [ "${{ inputs.prerelease }}" = "true" ] && echo --prerelease )

      # Lets a re-publish of an existing tag also repair its release notes.
      - name: Update existing release notes
        if: inputs.version == '' && inputs.notes != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.vars.outputs.tag }}
        run: gh release edit "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: yarn install --immutable

      # nitrogen/ is gitignored, so a fresh CI checkout has none of the generated
      # native bindings. Without this the published tarball omits them entirely
      # and every consumer's `pod install` / Gradle sync fails on a clean
      # install, because the podspec and build.gradle load them by path.
      # Skipped automatically on branches that do not use Nitro.
      - name: Generate Nitro bindings
        run: |
          if node -e "process.exit(require('./package.json').scripts?.codegen ? 0 : 1)"; then
            yarn codegen
          else
            echo "No codegen script in package.json; skipping."
          fi

      - name: Build package
        run: yarn prepare

      # Guard against shipping a tarball the native build cannot use. This
      # exact regression shipped three broken v5 betas before anyone noticed.
      - name: Verify packed tarball
        run: |
          if [ ! -f nitro.json ]; then
            echo "Not a Nitro package; nothing to verify."
            exit 0
          fi
          npm pack --silent --pack-destination "$RUNNER_TEMP" > "$RUNNER_TEMP/packname"
          TARBALL="$RUNNER_TEMP/$(cat "$RUNNER_TEMP/packname")"
          COUNT=$(tar tzf "$TARBALL" | grep -c 'nitrogen/generated' || true)
          echo "nitrogen/generated files in tarball: $COUNT"
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::Tarball contains no nitrogen/generated files, but nitro.json is present."
            echo "::error::Publishing this would break pod install and Gradle sync for every consumer."
            exit 1
          fi

      - name: Sync package.json version with release tag
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          npm version "${TAG#v}" --no-git-tag-version --allow-same-version

      - name: Publish to npm
        run: |
          if [ "${{ inputs.prerelease || github.event.release.prerelease }}" = "true" ]; then
            npm publish --tag beta
          else
            npm publish
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
